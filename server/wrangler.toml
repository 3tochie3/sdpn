name = "sdpn-registry"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
MINIAPP_URL = "https://3tochie3.github.io/sdpn/"
ALLOWED_ORIGINS = "https://3tochie3.github.io"
# Дата релиза — та же, что CONTENT.release.date в index.html. По ней сервер решает,
# какие сниппеты уже можно отдавать (день N открывается за 8−N дней до релиза).
# Пока пусто — сниппеты получают только авторы (секрет ADMIN_IDS).
RELEASE_DATE = ""

# Рассылка: сервер просыпается каждую минуту, но шлёт только в окна рассылки
# (19:00 МСК в каждый из 7 дней курса и в момент релиза). Без RELEASE_DATE — ничего не делает.
[triggers]
crons = ["* * * * *"]

# Сниппеты и картинки процедурного листа (ключи day3, day4, …)
[[kv_namespaces]]
binding = "TEASERS"
id = "8cedfbadf6554d9b93e016c7dd9d5e52"

# База пациентов. database_id появится после `npx wrangler d1 create sdpn` — впишите его сюда.
[[d1_databases]]
binding = "DB"
database_name = "sdpn"
database_id = "c348f9ab-816b-41c9-9d1e-88cf8193bf18"
