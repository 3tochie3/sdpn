<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f0e3">
<title>СДПН — ТРОЕТОЧИЕ</title>

<!-- Telegram Mini App SDK (в обычном браузере просто ничего не делает) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ТОКЕНЫ
   «Бумага» всегда светлая, а фон вокруг берётся из темы Telegram.
   ========================================================= */
:root {
  --paper: #f5f0e3;
  --paper-edge: #e8e0cc;
  --ink: #1c1b18;
  --ink-soft: #5d584c;
  --ink-faint: #8f887a;
  --rule: #cfc5ae;
  --blue: #2442a3;          /* чернила печати и подписей */
  --blue-soft: rgba(36, 66, 163, .12);
  --red: #c4302b;           /* ЭКГ, глитч, срывы */

  /* фон вокруг листа: переопределяется темой Telegram */
  --bg: #e7e1d2;
  --bg-text: #1c1b18;
  --bg-hint: #6f6a5e;
  --btn: #1c1b18;
  --btn-text: #f5f0e3;

  --serif: "PT Serif", "Times New Roman", Times, serif;
  --mono: "PT Mono", "Courier New", monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --vh: var(--tg-viewport-stable-height, 100vh);
}
@media (prefers-color-scheme: dark) {
  :root:not(.tg) { --bg: #16171a; --bg-text: #ecebe6; --bg-hint: #8d8b85; --btn: #f5f0e3; --btn-text: #1c1b18; }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--bg-text);
  font-family: var(--sans);
  min-height: var(--vh);
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.app { max-width: 520px; margin: 0 auto; padding: 14px 14px calc(28px + env(safe-area-inset-bottom)); }

/* ---------- Экраны ---------- */
.screen { display: none; }
.screen.active { display: block; animation: screenIn .38s cubic-bezier(.2,.7,.2,1) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Лист бумаги ---------- */
.sheet {
  position: relative;
  background-color: var(--paper);
  /* лёгкая фактура бумаги */
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 .16 -.06'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    linear-gradient(180deg, rgba(255,255,255,.35), rgba(0,0,0,0) 30%, rgba(120,100,60,.05));
  color: var(--ink);
  border-radius: 3px;
  padding: 22px 20px 24px;
  box-shadow: 0 1px 0 var(--paper-edge), 0 10px 30px -12px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.12);
  font-family: var(--serif);
}
.sheet.shake { animation: shake .32s ease-out; }
@keyframes shake {
  0% { transform: translateY(0); } 25% { transform: translateY(3px) rotate(.25deg); }
  55% { transform: translateY(-1px) rotate(-.15deg); } 100% { transform: none; }
}

/* ---------- Шапка учреждения ---------- */
.inst { text-align: center; line-height: 1.3; }
.inst .l1 { font-family: var(--serif); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; }
.inst .l2 { font-size: 12.5px; margin-top: 2px; }
.inst .l3 { font-size: 12px; color: var(--ink-soft); font-style: italic; margin-top: 1px; }
.double-rule { border: 0; height: 4px; border-top: 1.5px solid var(--ink); border-bottom: .75px solid var(--ink); margin: 12px 0 14px; }
.rule { border: 0; border-top: 1px dashed var(--rule); margin: 14px 0; }

/* ---------- Глитч-дата ---------- */
.glitch { font-family: var(--mono); letter-spacing: .02em; white-space: nowrap; }
.glitch .g { display: inline-block; min-width: .6em; text-align: center; }
.glitch .g.hot { color: var(--red); }

/* ---------- Кнопки ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; padding: 12px 16px;
  border: 0; border-radius: 12px;
  font-family: var(--sans); font-weight: 600; font-size: 15.5px; letter-spacing: .01em;
  transition: transform .12s ease, opacity .15s ease, background .2s;
  user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--btn); color: var(--btn-text); }
.sheet .btn-primary { background: var(--ink); color: var(--paper); } /* на бумаге — всегда чернила */
.btn-ink { background: var(--blue); color: #fff; }
.btn-ghost { background: transparent; color: var(--bg-text); border: 1.5px solid color-mix(in srgb, var(--bg-text) 22%, transparent); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: grid; gap: 10px; margin-top: 16px; }
/* в Telegram основную кнопку дублирует MainButton — внутреннюю прячем */
.tg-main .mb-dup { display: none; }

.disclaimer {
  font-family: var(--sans); font-size: 11.5px; line-height: 1.45; color: var(--bg-hint);
  text-align: center; margin: 18px 6px 0;
}

/* =========================================================
   1. РЕГИСТРАТУРА
   ========================================================= */
.ticket-top { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
.reg-label { font-family: var(--mono); font-size: 11px; letter-spacing: .25em; color: var(--ink-soft); text-align: center; margin-top: 18px; }
.logo {
  font-family: var(--serif); font-weight: 700; text-align: center;
  font-size: clamp(64px, 22vw, 96px); letter-spacing: .06em; line-height: 1; margin: 6px 0 4px;
  position: relative;
}
.logo .ecg-under { display: block; width: 100%; height: 34px; margin-top: 2px; }
/* «альбом ТРОЕТОЧИЕ» под логотипом */
.byline { text-align: center; margin: 8px 0 4px; }
.byline-k { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .22em; color: var(--ink-soft); text-transform: uppercase; }
.byline-v { display: block; font-family: var(--serif); font-weight: 700; font-size: 22px; letter-spacing: .18em; margin-top: 2px; }
.decode { margin: 16px 0 4px; display: grid; gap: 10px; }
.rx .artist { font-weight: 700; letter-spacing: .06em; }
.fineprint .artist { display: block; margin-top: 6px; font-style: normal; font-family: var(--mono); letter-spacing: .06em; color: var(--ink-soft); }
.decode div { display: grid; grid-template-columns: 26px 1fr; gap: 6px; font-size: 15px; line-height: 1.35; }
.decode .n { font-family: var(--mono); color: var(--ink-soft); font-size: 13px; padding-top: 2px; }
.decode em { display: block; font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; letter-spacing: .03em; }
.call {
  margin: 18px 0 16px; padding: 14px 14px; border: 1.5px solid var(--ink); border-radius: 2px;
  font-size: 15.5px; line-height: 1.45; position: relative;
}
.call b { display: block; font-size: 18px; margin-bottom: 4px; }
.doctor-line { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* =========================================================
   2. АНКЕТА
   ========================================================= */
.card-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; color: var(--ink-soft); text-transform: uppercase; }
.pages { display: flex; gap: 4px; margin: 10px 0 18px; }
.pages span {
  flex: 1; height: 16px; position: relative; border: 1px solid var(--rule); background: #fbf8f0;
  clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 0 100%); /* загнутый уголок */
  transition: background .3s, border-color .3s;
}
.pages span.done { background: var(--ink); border-color: var(--ink); }
.pages span.now { background: var(--blue-soft); border-color: var(--blue); }
.q-num { font-family: var(--mono); font-size: 12px; color: var(--blue); letter-spacing: .06em; }
.q-text { font-family: var(--serif); font-weight: 700; font-size: 21px; line-height: 1.3; margin: 6px 0 4px; text-wrap: pretty; }
.q-hint { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; }
.options { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: center; text-align: left;
  width: 100%; padding: 13px 12px; background: rgba(255,255,255,.45);
  border: 1px solid var(--rule); border-radius: 3px;
  font-family: var(--serif); font-size: 16px; line-height: 1.3; color: var(--ink);
  transition: background .15s, border-color .15s, transform .1s;
}
.opt:active { transform: scale(.99); }
.opt .box { width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 2px; position: relative; background: #fffdf6; }
.opt .box svg { position: absolute; left: -3px; top: -7px; width: 30px; height: 30px; overflow: visible; }
.opt .box path { fill: none; stroke: var(--blue); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
.opt.picked { background: var(--blue-soft); border-color: var(--blue); }
.opt.picked .box path { animation: tick .28s ease-out forwards; }
@keyframes tick { to { stroke-dashoffset: 0; } }
.options.locked .opt:not(.picked) { opacity: .45; }
.quiz-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
.back-link { background: none; border: 0; padding: 8px 0; font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }
.tg-back .back-link { visibility: hidden; }

/* =========================================================
   3. АНАЛИЗ (ЭКГ)
   ========================================================= */
.monitor { margin: 8px -6px 0; border: 1px solid var(--rule); background: #fbf7ee; border-radius: 2px; overflow: hidden; position: relative; }
.monitor canvas { display: block; width: 100%; height: 170px; }
.monitor .bpm { position: absolute; right: 8px; top: 6px; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
.monitor .bpm.hot { color: var(--red); }
.an-title { font-family: var(--serif); font-weight: 700; font-size: 20px; margin: 18px 0 4px; text-align: center; }
.an-status { font-family: var(--mono); font-size: 13.5px; text-align: center; min-height: 20px; color: var(--ink-soft); }
.an-status.hot { color: var(--red); }
.an-steps { list-style: none; padding: 0; margin: 16px 0 0; font-family: var(--mono); font-size: 12.5px; display: grid; gap: 6px; }
.an-steps li { display: flex; justify-content: space-between; color: var(--ink-faint); }
.an-steps li.ok { color: var(--ink); }
.an-steps li.ok span:last-child::before { content: "✓ "; color: var(--blue); }

/* =========================================================
   4. МЕДЗАКЛЮЧЕНИЕ
   ========================================================= */
.doc { font-size: 15px; line-height: 1.5; }
.doc h1 { font-family: var(--serif); font-size: 21px; letter-spacing: .06em; text-align: center; margin: 4px 0 8px; }
.doc .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; }
.doc .about { text-align: center; font-style: italic; font-size: 13.5px; margin: 10px 0 12px; color: var(--ink-soft); }
.field { display: flex; gap: 6px; align-items: baseline; margin: 3px 0; flex-wrap: wrap; }
.field .k { white-space: nowrap; }
.field .v { flex: 1; min-width: 120px; border-bottom: 1px dotted var(--ink-faint); font-family: var(--mono); font-size: 14px; padding: 0 2px; }
/* Поле «Ф.И.О. пациента» в регистратуре: строка бланка, вписанная синими чернилами */
.name-field { display: block; margin: 0 0 16px; }
.name-label { display: block; font-family: var(--serif); font-weight: 700; font-size: 15px; }
.name-field input {
  display: block; width: 100%; margin-top: 2px; padding: 8px 2px 6px;
  border: 0; border-bottom: 1.5px dotted var(--ink-faint); border-radius: 0; background: transparent; outline: none;
  font-family: var(--mono); font-size: 17px; /* ≥16px, чтобы iOS не зумил страницу */
  color: var(--blue); caret-color: var(--blue);
}
.name-field input::placeholder { color: var(--ink-faint); }
.name-field input:focus { border-bottom-color: var(--blue); border-bottom-style: solid; }
.name-hint { display: block; margin-top: 5px; font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--ink-soft); }
.doc p { margin: 9px 0; text-wrap: pretty; }
.doc .lbl { font-weight: 700; }
.doc ul { list-style: none; padding: 0; margin: 4px 0 0; }
.doc ul li { padding-left: 1.2em; text-indent: -1.2em; margin: 2px 0; }
.doc ul li::before { content: "— "; }
.doc ol { margin: 4px 0 0; padding-left: 1.3em; }
.doc ol li { margin: 3px 0; padding-left: 2px; }
.diag {
  margin: 12px 0; padding: 12px 12px; border-left: 3px solid var(--ink); background: rgba(255,255,255,.4);
}
.diag .name { font-weight: 700; font-size: 16.5px; line-height: 1.35; }
.diag .code { font-family: var(--mono); font-size: 13px; margin-top: 4px; }
.diag .co { font-size: 13.5px; color: var(--ink-soft); font-style: italic; margin-top: 6px; }
.scores { font-family: var(--mono); font-size: 12.5px; margin-top: 4px; display: grid; gap: 3px; }
.scores div { display: flex; align-items: baseline; gap: 6px; }
.scores .dots { flex: 1; border-bottom: 1px dotted var(--ink-faint); transform: translateY(-3px); }
.scores .hi { color: var(--blue); font-weight: 700; }
.rx {
  margin: 12px 0; padding: 14px 12px; border: 1.5px solid var(--ink); position: relative;
}
.rx::before { content: "Rp."; position: absolute; top: -10px; left: 10px; background: var(--paper); padding: 0 6px; font-style: italic; font-weight: 700; }
.rx .track { font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1.25; color: var(--blue); }
.rx .why { font-size: 14px; color: var(--ink-soft); margin-top: 10px; font-style: italic; }
.signs { position: relative; margin-top: 22px; padding-bottom: 6px; }
.sign-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: end; margin: 14px 0 0; font-size: 14px; }
.sign-row .line { border-bottom: 1px solid var(--ink); height: 30px; position: relative; }
.sign-row .line svg { position: absolute; left: 6%; bottom: -6px; width: 92px; height: 42px; overflow: visible; }
.sign-row .line path { fill: none; stroke: var(--blue); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.mp { font-family: var(--serif); margin-top: 16px; font-weight: 700; }
.stamp {
  position: absolute; left: 18px; bottom: -62px; width: 168px; height: 168px;
  opacity: 0; pointer-events: none; mix-blend-mode: multiply;
}
.stamp.on { animation: stampIn .5s cubic-bezier(.3,1.5,.5,1) forwards; }
@keyframes stampIn {
  0% { opacity: 0; transform: scale(1.9) rotate(-34deg); }
  45% { opacity: .95; transform: scale(.94) rotate(-13deg); }
  100% { opacity: .9; transform: scale(1) rotate(-14deg); }
}
.fineprint { font-size: 11.5px; color: var(--ink-faint); font-style: italic; margin-top: 64px; text-align: center; line-height: 1.4; }

/* =========================================================
   ПРЕДРЕЛИЗНЫЙ РЕЖИМ
   ========================================================= */
[hidden] { display: none !important; }
/* Объявление с отсчётом */
.notice { margin: 18px 0 0; padding: 12px 14px 14px; border: 1.5px dashed var(--red); position: relative; text-align: center; }
.notice .n-label { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--red); }
.notice .n-title { font-weight: 700; font-size: 15.5px; line-height: 1.35; }
.notice .n-sub { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
.notice .n-count { font-family: var(--mono); font-size: 26px; letter-spacing: .04em; margin-top: 2px; color: var(--red); font-variant-numeric: tabular-nums; }
.notice .n-count small { font-size: 12px; color: var(--ink-soft); margin: 0 6px 0 2px; letter-spacing: 0; }
.notice .n-rec { font-family: var(--mono); font-size: 11.5px; color: var(--blue); margin-top: 8px; }
.notice.released { border-color: var(--blue); }
.notice.released .n-label { color: var(--blue); }
.glitch .g.fix { color: var(--blue); }

/* Процедурный лист */
.proc { margin-top: 14px; }
.proc h2 { font-family: var(--serif); font-size: 18px; margin: 0; letter-spacing: .04em; }
.proc .p-sub { font-style: italic; font-size: 13px; color: var(--ink-soft); margin: 4px 0 12px; }
.p-row { border-top: 1px dashed var(--rule); }
.p-row:last-child { border-bottom: 1px dashed var(--rule); }
.p-head { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: baseline; width: 100%; padding: 11px 0; background: none; border: 0; text-align: left; font-family: var(--serif); color: var(--ink); }
.p-head .d { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
.p-head .t { font-size: 15px; font-weight: 700; }
.p-head .s { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
.p-row.open .p-head .s { color: var(--blue); }
.p-row.locked .p-head { cursor: default; }
.p-head .t.redacted { display: block; height: 11px; width: 78%; background: var(--ink); opacity: .78; transform: translateY(1px); } /* «вымарано» */
.p-row.today .p-head .d { color: var(--red); }
.p-body { padding: 0 0 14px 66px; font-size: 14.5px; line-height: 1.5; display: none; }
.p-row.expanded .p-body { display: block; }
.p-body blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--blue); font-style: italic; font-size: 16px; }
.p-body .cap { font-size: 12.5px; color: var(--ink-soft); }
.p-body audio { width: 100%; margin-top: 8px; }
/* Плеер «пробной дозы» */
.dose { margin-top: 10px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 6px 12px; align-items: center; }
.dose-btn { grid-row: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-family: var(--sans); font-weight: 600; font-size: 14px; }
.dose-btn .i { width: 16px; text-align: center; font-size: 12px; }
.dose-btn:active { transform: scale(.97); }
.dose-ecg svg { display: block; width: 100%; height: 30px; overflow: visible; }
.dose-ecg path { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
.dose-ecg .bg { stroke: var(--rule); }
.dose-ecg .fg { stroke: var(--red); stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .25s linear; }
.dose-time { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
.dose.playing .dose-btn { background: var(--red); }
/* Видеодоза */
.vdose { margin-top: 10px; aspect-ratio: 1 / 1; background: #121214; border: 1px solid var(--ink); position: relative; overflow: hidden;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px); }
.vdose video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
.vdose-start { position: absolute; inset: 0; width: 100%; border: 0; background: none; color: #f5f0e3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: var(--sans); }
.vdose-start .vd-i { width: 64px; height: 64px; border-radius: 50%; background: var(--red); display: grid; place-items: center; font-size: 22px; padding-left: 4px; box-shadow: 0 0 0 8px rgba(196,48,43,.18); }
.vdose-start .vd-l { font-weight: 600; font-size: 15px; }
.vdose-start .vd-s { font-family: var(--mono); font-size: 11px; color: #8d8b85; letter-spacing: .08em; }
.vdose-start:active .vd-i { transform: scale(.95); }
.p-body img { width: 100%; margin-top: 8px; border: 1px solid var(--rule); filter: grayscale(1) contrast(1.15); }
.p-body ol { margin: 6px 0 0; padding-left: 1.4em; font-family: var(--mono); font-size: 13px; }

/* Постановка на учёт */
.reg-card { background: var(--paper); color: var(--ink); border-radius: 3px; padding: 14px 14px 12px; font-family: var(--serif); border-left: 4px solid var(--blue); }
.reg-card .r-title { font-weight: 700; font-size: 16px; }
.reg-card .r-text { font-size: 14px; line-height: 1.45; margin: 4px 0 10px; }
.reg-card .r-priv { font-size: 11.5px; color: var(--ink-faint); font-style: italic; margin-top: 8px; line-height: 1.4; }

  ok()    { try { IN_TG && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
};

function applyTheme() {
  if (!IN_TG) return;
  const p = tg.themeParams || {};
  const r = document.documentElement.style;
  if (p.bg_color) r.setProperty('--bg', p.secondary_bg_color || p.bg_color);
  if (p.text_color) r.setProperty('--bg-text', p.text_color);
  if (p.hint_color) r.setProperty('--bg-hint', p.hint_color);

  r.setProperty('--btn-text', dark ? '#1c1b18' : '#f5f0e3');
  try {
    const bg = p.secondary_bg_color || p.bg_color;
    if (tgv('6.1') && bg) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
  } catch (e) {}

/* =====================================================================
   РЕЛИЗ: фазы 'none' (дата не задана) → 'prerelease' → 'released'
   ===================================================================== */
const QS = new URLSearchParams(location.search);
const DAY = 864e5;
function releaseDate() {
  // ?days=N — предпросмотр: «релиз через N дней» (0 — уже вышел)
  if (QS.has('days')) { const d = parseFloat(QS.get('days')) || 0; return new Date(PAGE_T0 + (d > 0 ? d * DAY - 6e4 : -36e5)); }
  const d = CONTENT.release.date ? new Date(CONTENT.release.date) : null;
  return d && !isNaN(d) ? d : null;
}
const PAGE_T0 = Date.now();
function releaseInfo() {
  const date = releaseDate();
  if (!date) return { phase: 'none' };
  const ms = date - Date.now();
  if (ms <= 0) return { phase: 'released', date };
  return { phase: 'prerelease', date, ms, daysLeft: Math.ceil(ms / DAY) };
}
/* Дата релиза в виде ДД.ММ.ГГГГ в часовом поясе релиза */
function releaseDateStr(date) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('ru-RU', { timeZone: CONTENT.release.tz, day: '2-digit', month: '2-digit', year: 'numeric' })
    .formatToParts(date).map((x) => [x.type, x.value]));
  return `${p.day}.${p.month}.${p.year}`;
}
/* Какие символы глитч-даты уже «стабилизировались».
   Позиции: 0,1 — день, 3,4 — месяц. Открываются за 6, 4, 2 и 1 день до релиза. */
function stableGlitch() {
  const base = CONTENT.inst.glitchDate, r = releaseInfo();
  if (r.phase === 'none') return { text: base, fixed: [] };
  const target = releaseDateStr(r.date);
  const order = [[6, 4], [4, 3], [2, 1], [1, 0]]; // [дней до релиза, позиция]
  const fixed = r.phase === 'released' ? [0, 1, 3, 4] : order.filter(([d]) => r.daysLeft <= d).map(([, i]) => i);
  const text = [...base].map((c, i) => (i >= base.length - 4 ? target[i] : fixed.includes(i) ? target[i] : c)).join('');
  return { text, fixed };
}

/* ---------- Глитч-дата ----------
   Базовая строка «*#.^?.2027». Символы до года периодически подменяются,
   изредка на мгновение проступает «настоящая» (но невозможная) дата.
   В предрелизный период символы по одному встают на место (см. stableGlitch). */
const GLITCH_CHARS = '*#^?%&@!§¿0123456789';
const FAKE_DATES = ['31.02.2027', '00.13.2027', '32.##.2027', '29.02.2027'];
function mountGlitch(el) {
  const { text: base, fixed } = stableGlitch();
  el.innerHTML = [...base].map((c, i) => `<span class="g${fixed.includes(i) ? ' fix' : ''}">${esc(c)}</span>`).join('');
  const spans = [...el.children];
  const mutable = spans.map((s, i) => i).filter((i) => i < base.length - 4 && base[i] !== '.' && !fixed.includes(i));
  if (!mutable.length) return; // дата полностью стабилизировалась — больше не мерцает
  setInterval(() => {
    if (!el.isConnected || document.hidden) return;
    if (Math.random() < 0.06) {               // редкая «правдоподобная» дата
      const fake = FAKE_DATES[Math.floor(Math.random() * FAKE_DATES.length)];
      spans.forEach((s, i) => { s.textContent = fake[i] || ''; s.classList.add('hot'); });
      setTimeout(() => spans.forEach((s, i) => { s.textContent = base[i]; s.classList.remove('hot'); }), 160);
      return;
    }
    const i = mutable[Math.floor(Math.random() * mutable.length)];
    const s = spans[i];
    s.textContent = GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)];
    s.classList.toggle('hot', Math.random() < 0.3);
    setTimeout(() => { s.textContent = base[i]; s.classList.remove('hot'); }, 90 + Math.random() * 120);
  }, 220);
}

/* ---------- Плеер «пробной дозы» ----------

const ECG_PATH = 'M0 22 H40 l4 -3 l4 3 h8 l3 6 l5 -24 l5 22 l3 -4 h14 l4 -2 l4 2 H130 l3 5 l5 -24 l4 26 l4 -16 l4 12 l3 -8 l3 4 H214 l4 -3 l4 3 h8 l3 6 l5 -24 l5 22 l3 -4 h14 l4 -2 l4 2 H300';
function dosePlayerHTML(src, key) {
  return `<div class="dose" data-src="${esc(src)}" data-key="${esc(key)}">
    <button class="dose-btn" aria-label="Принять дозу"><span class="i">▶</span><span class="l">Принять дозу</span></button>
    <div class="dose-ecg"><svg viewBox="0 0 300 34" preserveAspectRatio="none"><path class="bg" d="${ECG_PATH}"/><path class="fg" d="${ECG_PATH}" pathLength="1"/></svg></div>
    <div class="dose-time">0:00</div>

const teaserCache = {};
/* Файл с сервера: отдаётся только в свой день (или авторам в /preview). Возвращает blob:-URL. */
function fetchTeaser(key) {
  if (!teaserCache[key]) teaserCache[key] = (async () => {
    const r = await fetch(CONTENT.api.replace(/\/$/, '') + '/teaser', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ key, initData: IN_TG ? tg.initData : '' }),
    });
    if (!r.ok) { delete teaserCache[key]; throw new Error(r.status); }
    return URL.createObjectURL(await r.blob());
  })();
  return teaserCache[key];
}
/* ---------- Видеодоза ----------
   До нажатия — тёмный «снимок» с кнопкой (файл не грузится, трафик не тратится).
   По нажатию файл приходит с сервера (в свой день) и играет прямо в листе, без полноэкранного режима. */

  v.setAttribute('controlslist', 'nodownload noplaybackrate'); v.disablePictureInPicture = true;

let currentDose = null;
async function toggleDose(box) {
  haptic.tap();
  const btn = box.querySelector('.dose-btn'), label = btn.querySelector('.l'), icon = btn.querySelector('.i');
  if (!box._audio) {

    catch (e) {

      return;

    box._audio = a;
    const fg = box.querySelector('.fg'), time = box.querySelector('.dose-time');
    const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

    });
    a.addEventListener('ended', () => { box.classList.remove('playing'); icon.textContent = '↺'; label.textContent = 'Повторить дозу'; });
    a.addEventListener('pause', () => box.classList.remove('playing'));
    a.addEventListener('play', () => box.classList.add('playing'));
  }
  const a = box._audio;
  if (currentDose && currentDose !== a) currentDose.pause();
  currentDose = a;
  if (a.paused) { if (a.ended) a.currentTime = 0; a.play().catch(() => {}); icon.textContent = '❚❚'; label.textContent = 'Приём дозы'; }
  else { a.pause(); icon.textContent = '▶'; label.textContent = 'Продолжить приём'; }

/* ===== Подсчёт результата ===== */
function scaleMax() {
  const max = Object.fromEntries(CONTENT.scaleOrder.map((s) => [s, 0]));
  CONTENT.questions.forEach((q) => CONTENT.scaleOrder.forEach((s) => {
    max[s] += Math.max(...q.options.map((o) => o[1][s] || 0));
  }));
  return max;
}
function computeResult(answers) {
  const raw = Object.fromEntries(CONTENT.scaleOrder.map((s) => [s, 0]));
  answers.forEach((oi, qi) => {
    const w = CONTENT.questions[qi].options[oi][1];
    for (const s in w) raw[s] += w[s];
  });
  const max = scaleMax();
  const norm = Object.fromEntries(CONTENT.scaleOrder.map((s) => [s, max[s] ? raw[s] / max[s] : 0]));
  const ranked = CONTENT.scaleOrder.slice().sort((a, b) =>
    (norm[b] - norm[a]) || (CONTENT.scaleOrder.indexOf(a) - CONTENT.scaleOrder.indexOf(b)));
  const primary = ranked[0];
  const secondary = norm[ranked[1]] > 0 ? ranked[1] : null;
  const form = CONTENT.forms.find((f) => f.scale === primary);
  const trackId = (secondary && form.pick[secondary]) || form.main;
  return { form, trackId, track: CONTENT.tracks[trackId], primary, secondary, norm };
}

/* ===== 3. Анализ: ЭКГ ===== */
function runAnalysis() {
  setBack(null);
  show('s-analysis');
  state.result = computeResult(state.answers);
  const steps = CONTENT.ui.analysisSteps;
  $('#an-steps').innerHTML = steps.map((s) => `<li><span>${esc(s[2])}</span><span></span></li>`).join('');
  const lis = [...$('#an-steps').children];
  const status = $('#an-status'), bpmEl = $('#bpm');
  const cv = $('#ecg'), ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

  const T = 2.2;                      // длительность анимации, сек
  const FLAT = 0.45, CHAOS = 1.2;     // ровная линия → норма → срыв
  // Заранее генерируем сигнал (одна точка на пиксель)
  const pts = [];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = (x, m, w) => Math.exp(-((x - m) ** 2) / (2 * w * w));
  for (let x = 0; x <= W; x++) {
    const t = (x / W) * T;
    let y = (rnd() - .5) * 0.02;
    if (t > FLAT && t < CHAOS) {      // нормальные PQRST-комплексы
      const ph = ((t - FLAT) % 0.36) / 0.36;
      y += 0.08 * g(ph, .18, .03) - 0.1 * g(ph, .3, .012) + 0.9 * g(ph, .34, .012) - 0.22 * g(ph, .38, .014) + 0.16 * g(ph, .6, .05);
    } else if (t >= CHAOS) {          // хаос: пики растут
      const k = Math.min(1, (t - CHAOS) / (T - CHAOS) * 1.6);
      y += (rnd() - .45) * (0.25 + 1.1 * k) * (rnd() < .35 ? 1.6 : .5);
    }
    pts.push([x, H * 0.58 - y * H * 0.4, t >= CHAOS]);
  }

  const grid = () => {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(196,48,43,.10)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 12) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 12) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
  };
  let t0 = null;                      // старт берём из первого кадра, а не из performance.now()
  let lastBuzz = 0, stepIdx = -1, done = false;
  const finish = () => { if (done) return; done = true; clearTimeout(safety); setTimeout(renderResult, 200); };
  // страховка: если анимация по любой причине встанет — всё равно показываем заключение
  const safety = setTimeout(finish, (T + 1.5) * 1000);
  function frame(now) {
    if (done) return;
    try { draw(now); } catch (e) { console.error(e); finish(); }
  }
  function draw(now) {
    if (t0 === null) t0 = now;
    // время кадра может прийти чуть раньше старта — не даём ему стать отрицательным
    const t = Math.max(0, Math.min(T, (now - t0) / 1000));
    const head = Math.max(0, Math.min(pts.length - 1, Math.floor((t / T) * W)));
    grid();
    ctx.lineJoin = 'round'; ctx.lineWidth = 2;
    // нормальная часть — чернилами, хаос — красным
    for (const hot of [false, true]) {
      ctx.strokeStyle = hot ? '#c4302b' : '#1c1b18';
      ctx.beginPath();
      for (let x = 1; x <= head && x < pts.length; x++) {
        if (pts[x][2] !== hot) continue;
        ctx.moveTo(pts[x - 1][0], pts[x - 1][1]); ctx.lineTo(pts[x][0], pts[x][1]);
      }
      ctx.stroke();
    }
    const hp = pts[head];
    ctx.fillStyle = hp[2] ? '#c4302b' : '#1c1b18';
    ctx.beginPath(); ctx.arc(hp[0], hp[1], 3.2, 0, Math.PI * 2); ctx.fill();

    // ЧСС
    if (t < FLAT) bpmEl.textContent = 'ЧСС: 60';
    else if (t < CHAOS) bpmEl.textContent = 'ЧСС: ' + Math.round(64 + (t - FLAT) * 18);
    else { bpmEl.textContent = 'ЧСС: ' + (Math.random() < .5 ? '???' : Math.round(130 + Math.random() * 90)); bpmEl.classList.add('hot'); }
    if (t >= CHAOS && now - lastBuzz > 140) { haptic.light(); lastBuzz = now; }

    // подписи этапов
    const si = steps.reduce((acc, s, i) => (t >= s[0] ? i : acc), 0);
    if (si !== stepIdx) {
      stepIdx = si;
      status.textContent = steps[si][1];
      status.classList.toggle('hot', si === 3);
      lis.forEach((li, i) => li.classList.toggle('ok', i < si || (i === si && si === steps.length - 1)));
    }
    if (t < T) requestAnimationFrame(frame);
    else finish();
  }
  bpmEl.classList.remove('hot');
  requestAnimationFrame(frame);
}

async function fontsReady() {
  try {
    await Promise.all(['400 40px "PT Serif"', '700 40px "PT Serif"', 'italic 400 40px "PT Serif"', '400 40px "PT Mono"']
      .map((f) => document.fonts.load(f, 'АБВабв')));
  } catch (e) {}
}
function wrap(ctx, text, maxW) {
  const words = String(text).split(/\s+/); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
/* Печать на canvas: рисуется на отдельном слое, потом «вытирается» шумом и кладётся multiply */
function drawStamp(ctx, cx, cy, R, rot) {
  const S = Math.ceil(R * 2 + 20);
  const c = document.createElement('canvas'); c.width = c.height = S;
  const s = c.getContext('2d');
  const blue = '#2442a3';
  s.translate(S / 2, S / 2);
  s.strokeStyle = blue; s.fillStyle = blue;
  const ring = (r, w) => { s.lineWidth = w; s.beginPath();
    for (let a = 0; a <= Math.PI * 2 + .01; a += .02) { const j = r + Math.sin(a * 7) * R * .004 + (Math.random() - .5) * R * .006;
      a === 0 ? s.moveTo(Math.cos(a) * j, Math.sin(a) * j) : s.lineTo(Math.cos(a) * j, Math.sin(a) * j); }
    s.closePath(); s.stroke(); };
  ring(R * .96, R * .034); ring(R * .91, R * .01); ring(R * .68, R * .016); ring(R * .47, R * .012);
  const arcText = (text, r, size) => {
    s.save(); s.font = `700 ${size}px "PT Serif"`; s.textAlign = 'center'; s.textBaseline = 'middle';
    const chars = [...text]; const step = (Math.PI * 2) / chars.length;
    chars.forEach((ch, k) => { s.save(); s.rotate(-Math.PI / 2 + k * step + step / 2); s.translate(r, 0); s.rotate(Math.PI / 2); s.fillText(ch, 0, 0); s.restore(); });
    s.restore();
  };
  arcText('• МИНИСТЕРСТВО ЗВУКОВОГО ЗДРАВООХРАНЕНИЯ • ЦЕНТР МУЗЫКАЛЬНОЙ ПСИХОТЕРАПИИ «СДПН» ', R * .795, R * .1);
  arcText('• ОТДЕЛЕНИЕ АУДИАЛЬНОЙ ТЕРАПИИ • ВЛАДИВОСТОК ', R * .575, R * .088);
  s.textAlign = 'center'; s.textBaseline = 'middle';
  s.font = `700 ${R * .125}px "PT Serif"`; s.fillText('ДИАГНОЗ', 0, -R * .07);
  s.font = `700 ${R * .104}px "PT Serif"`; s.fillText('ПОДТВЕРЖДЁН', 0, R * .1);
  s.font = `400 ${R * .075}px "PT Mono"`; s.fillText('★ СДПН ★', 0, R * .25);
  // износ оттиска
  s.setTransform(1, 0, 0, 1, 0, 0);
  s.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 900; k++) { s.globalAlpha = Math.random() * .7; s.beginPath(); s.arc(Math.random() * S, Math.random() * S, Math.random() * R * .018, 0, Math.PI * 2); s.fill(); }
  s.globalAlpha = .35; s.beginPath(); s.ellipse(S * .7, S * .3, S * .22, S * .1, .6, 0, Math.PI * 2); s.fill();
  ctx.save(); ctx.globalAlpha = .9; ctx.globalCompositeOperation = 'multiply';
  ctx.translate(cx, cy); ctx.rotate(rot); ctx.drawImage(c, -S / 2, -S / 2); ctx.restore();
}

async function drawCard(result, number, name) {
  await fontsReady();
  const W = 1080, H = 1920, M = 92;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const f = result.form, inst = CONTENT.inst;

  // бумага
  x.fillStyle = '#f5f0e3'; x.fillRect(0, 0, W, H);
  for (let k = 0; k < 9000; k++) { x.fillStyle = `rgba(90,70,40,${Math.random() * .05})`; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
  const grad = x.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(110,90,50,.12)');
  x.fillStyle = grad; x.fillRect(0, 0, W, H);

  const ink = '#1c1b18', soft = '#5d584c';
  const center = (t, y) => { x.textAlign = 'center'; x.fillText(t, W / 2, y); x.textAlign = 'left'; };
  // Telegram перекрывает ~150px сверху и снизу сторис — важное держим в середине
  let y = 140;
  x.fillStyle = ink; x.textBaseline = 'alphabetic';
  x.font = '700 28px "PT Serif"'; center(inst.ministry, y); y += 40;
  x.font = '400 28px "PT Serif"'; center(inst.center, y); y += 36;
  x.font = 'italic 400 26px "PT Serif"'; x.fillStyle = soft; center(inst.dept, y); y += 28;
  x.fillStyle = ink; x.fillRect(M, y, W - 2 * M, 4); x.fillRect(M, y + 9, W - 2 * M, 1.5); y += 84;

  x.font = '700 54px "PT Serif"'; center('МЕДИЦИНСКОЕ ЗАКЛЮЧЕНИЕ', y); y += 64;
  x.font = '400 30px "PT Mono"';
  x.fillText('Дата: ', M, y);
  const dx = M + x.measureText('Дата: ').width;
  x.fillStyle = '#c4302b'; x.fillText(inst.glitchDate, dx, y); x.fillStyle = ink;
  x.textAlign = 'right'; x.fillText(`№ ${number}`, W - M, y); x.textAlign = 'left'; y += 42;
  x.fillText(inst.city, M, y); y += 62;

  // ЭКГ-полоса: ровно → норма → срыв
  x.strokeStyle = '#c4302b'; x.lineWidth = 3; x.lineJoin = 'round'; x.beginPath();
  const ey = y; x.moveTo(M, ey);
  for (let px = M; px <= W - M; px += 6) {
    const k = (px - M) / (W - 2 * M);
    let dy = 0;
    if (k > .3 && k < .62) { const ph = ((k - .3) * 9) % 1; dy = ph > .45 && ph < .5 ? -44 : ph > .5 && ph < .55 ? 26 : 0; }
    if (k >= .62) dy = (Math.random() - .5) * 100 * (k - .55) * 2.4;
    x.lineTo(px, ey + dy);
  }
  x.stroke(); y += 92;

  x.font = '400 32px "PT Serif"'; x.fillStyle = ink;
  x.fillText('Ф.И.О. пациента: ', M, y);
  const nx = M + x.measureText('Ф.И.О. пациента: ').width;
  // длинное имя уменьшаем, чтобы влезло в строку
  let ns = 32; do { x.font = `400 ${ns}px "PT Mono"`; ns -= 2; } while (x.measureText(name).width > W - M - nx && ns > 18);
  x.fillStyle = name === 'Неизвестно' ? ink : '#2442a3'; x.fillText(name, nx, y); x.fillStyle = ink;
  x.setLineDash([3, 6]); x.strokeStyle = '#8f887a'; x.lineWidth = 2; x.beginPath(); x.moveTo(nx, y + 10); x.lineTo(W - M, y + 10); x.stroke(); x.setLineDash([]);
  y += 82;

  // Диагноз (короткое название формы)
  x.font = '700 30px "PT Serif"'; x.fillText('ДИАГНОЗ:', M, y); y += 70;
  const dTop = y - 52;
  x.font = '700 62px "PT Serif"';
  wrap(x, f.short, W - 2 * M - 30).forEach((l) => { x.fillText(l, M + 30, y); y += 70; });
  x.font = '400 30px "PT Mono"'; x.fillText(`Код: ${f.code}`, M + 30, y - 16); y += 10;
  x.fillRect(M, dTop, 7, y - dTop - 10); y += 58;

  // Клиническая картина (3 пункта)
  x.font = '700 30px "PT Serif"'; x.fillText('Клиническая картина:', M, y); y += 46;
  x.font = '400 30px "PT Serif"';
  f.picture.slice(0, 3).forEach((p) => { wrap(x, '— ' + p, W - 2 * M).forEach((l) => { x.fillText(l, M, y); y += 42; }); });
  y += 14;

  // Назначение — в рамке
  const boxTop = y;
  y += 64;
  x.font = 'italic 700 34px "PT Serif"'; x.fillText('Rp.  Назначение:', M + 34, y); y += 82;
  x.fillStyle = '#2442a3';
  let ts = 72, tl;
  do { x.font = `700 ${ts}px "PT Serif"`; tl = wrap(x, `«${result.track.title}»`, W - 2 * M - 68); ts -= 6; } while (tl.length > 2 && ts > 44);
  tl.forEach((l) => { x.fillText(l, M + 34, y); y += ts + 14; });
  x.fillStyle = ink; x.font = '400 30px "PT Serif"'; y += 2;
  x.fillText('с альбома «СДПН» — Сборник Для', M + 34, y); y += 42;
  x.fillText('Психически Нестабильных', M + 34, y); y += 50;
  x.font = '700 34px "PT Serif"'; x.fillText('Исполнитель: ' + CONTENT.artist, M + 34, y); y += 30;
  x.strokeStyle = ink; x.lineWidth = 3; x.strokeRect(M, boxTop, W - 2 * M, y - boxTop);
  y += 76;

  // Подписи + печать поверх «М.П.»
  x.fillStyle = ink; x.font = '400 30px "PT Serif"';
  const sign = (label, who, d, yy) => {
    x.fillText(label, M, yy);
    const lx = M + x.measureText(label).width + 20, rx = W - M - x.measureText(who).width - 20;
    x.fillRect(lx, yy + 6, rx - lx, 2);
    x.textAlign = 'right'; x.fillText(who, W - M, yy); x.textAlign = 'left';
    x.save(); x.translate(lx + 20, yy - 46); x.scale(2, 1.5); x.strokeStyle = '#2442a3'; x.lineWidth = 1.6; x.lineCap = 'round'; x.stroke(new Path2D(d)); x.restore();
  };
  sign('Лечащий врач', inst.doctor, SIGN_GOROKH, y); y += 78;
  sign('Заведующий отделением', inst.head, SIGN_MYAGKOV, y); y += 70;
  x.font = '700 32px "PT Serif"'; x.fillText('М.П.', M, y);
  drawStamp(x, M + 260, y - 70, 160, -0.24);

  // Подвал
  x.font = 'italic 400 22px "PT Serif"'; x.fillStyle = '#8f887a';
  wrap(x, CONTENT.ui.docFooter, W - 2 * M).forEach((l, k) => center(l, H - 108 + k * 30));
  x.font = '400 24px "PT Mono"'; x.fillStyle = soft; center(`${CONTENT.artist} · альбом «СДПН»`, H - 44);
  return c;
}

/* ---------- Сохранение / сторис ---------- */
let lastBlobUrl = '';
async function openSaveOverlay(hint) {
  toast(CONTENT.ui.preparing);
  const canvas = await drawCard(state.result, state.number, patientName());
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  $('#ov-img').src = dataUrl;
  $('#ov-hint').textContent = hint;
  $('#overlay').classList.add('on');
  $('#toast').classList.remove('on');
  setMain(null);
  setBack(closeOverlay);
  $('#ov-download').onclick = async () => {
    haptic.tap();
    const fileName = `${state.number}.jpg`;
    // 1) Telegram 8.0+: нативное скачивание — но только по публичному URL (готовая карточка трека)
    const pub = storyUrl(state.result.trackId);
    if (IN_TG && tgv('8.0') && pub && await exists(pub)) { try { tg.downloadFile({ url: pub, file_name: `СДПН-${state.result.trackId}.jpg` }); return; } catch (e) {} }
    let blob;
    try { blob = await (await fetch(dataUrl)).blob(); } catch (e) { toast(CONTENT.ui.saveHint); return; }
    // 2) Только на телефонах: системное меню «Поделиться» → «Сохранить изображение».
    //    На компьютере (Windows/macOS) это меню часто падает с ошибкой, поэтому там сразу скачиваем.
    const isPhone = matchMedia('(pointer: coarse)').matches && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isPhone) {
      try {
        const file = new File([blob], fileName, { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      } catch (e) {
        if (e && e.name === 'AbortError') return; // пользователь сам закрыл меню
        // иначе — падаем в обычное скачивание
      }
    }
    // 3) Обычное скачивание файла
    try {
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = lastBlobUrl; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast(CONTENT.ui.saveHint); }
  };
}
function closeOverlay() {
  $('#overlay').classList.remove('on');
  setBack(null);
  setMain(rxLabel().toUpperCase(), acceptRx, '#2442a3');
}

/* Готовые картинки для сторис лежат в /stories/<id трека>.jpg (см. README). */
function storyUrl(trackId) {
  try {
    const u = new URL(CONTENT.links.stories + trackId + '.jpg', location.href);
    return u.protocol === 'https:' ? u.href : '';
  } catch (e) { return ''; }
}
async function exists(url) {
  try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); return r.ok; } catch (e) { return false; }
}
async function shareStory() {
  haptic.tap();
  const url = storyUrl(state.result.trackId);
  if (IN_TG && tgv('7.8') && url && await exists(url)) {
    const params = { text: CONTENT.ui.storyText };
    if (CONTENT.links.miniApp) params.widget_link = { url: CONTENT.links.miniApp, name: 'Пройти обследование' };
    try { tg.shareToStory(url, params); return; } catch (e) {}
  }
  // запасной вариант: показать персональную карточку для ручной публикации
  openSaveOverlay(CONTENT.ui.storyFallbackHint);
}

/* =====================================================================
   СЛУЖЕБНЫЕ РЕЖИМЫ (для автора)
   ?export=stories — сгенерировать картинки для сторис по всем трекам
                     и отправить на локальный tools/save_server.py
   ?sim            — прогнать 20 000 случайных анкет и показать распределение
   ===================================================================== */
async function exportStories() {
  const ids = Object.keys(CONTENT.tracks);
  const out = [];
  for (const id of ids) {
    const form = CONTENT.forms.find((f) => f.main === id || Object.values(f.pick).includes(id));
    const canvas = await drawCard({ form, trackId: id, track: CONTENT.tracks[id] }, 'СДПН-' + String(101 + ids.indexOf(id)), 'Неизвестно');
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));
    const res = await fetch('/__save?name=' + encodeURIComponent(id + '.jpg'), { method: 'PUT', body: blob }).catch(() => null);
    out.push(id + (res && res.ok ? ' ✓' : ' ✗'));
  }
  document.body.innerHTML = '<pre style="padding:20px;font:14px monospace">' + out.join('\n') + '</pre>';
  return out;
}
function simulate(n = 20000) {
  const byForm = {}, byTrack = {};
  for (let k = 0; k < n; k++) {
    const ans = CONTENT.questions.map((q) => Math.floor(Math.random() * q.options.length));
    const r = computeResult(ans);
    byForm[r.form.code] = (byForm[r.form.code] || 0) + 1;
    byTrack[r.trackId] = (byTrack[r.trackId] || 0) + 1;
  }
  return { byForm, byTrack, missing: Object.keys(CONTENT.tracks).filter((t) => !byTrack[t]) };
}

/* ---------- Старт ---------- */
document.querySelectorAll('[data-t]').forEach((el) => { const v = get(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
document.querySelectorAll('[data-inst]').forEach((el) => { el.innerHTML = instHTML(); });
document.querySelectorAll('[data-artist]').forEach((el) => { el.textContent = CONTENT.artist; });
document.querySelectorAll('[data-glitch]').forEach(mountGlitch);
const params = new URLSearchParams(location.search);
if (params.has('export')) exportStories();
else if (params.has('sim')) { document.body.innerHTML = '<pre style="padding:20px;font:14px monospace">' + JSON.stringify(simulate(), null, 2) + '</pre>'; }
else renderStart();
</script>
